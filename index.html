<title>Divertiti a suonare</title>

*{box-sizing:border-box;min-width:0}
#sn{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
body.neve #sn{display:block}
body.neve #set{border-color:#D32F2F}
body.neve .sel{background:#D32F2F;color:#FFFFFF;border-color:#A32D2D}
body.neve #big{background:#D32F2F;color:#FFFFFF!important}

main{position:relative;z-index:1}
body.neve main{border-top:8px solid transparent;border-image:repeating-linear-gradient(90deg,#D32F2F 0 18px,#FFFFFF 18px 30px,#2E8B3A 30px 48px,#FFFFFF 48px 60px) 8}
body{margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip}
main{max-width:1240px;margin:0 auto;padding:16px max(3vw,12px) 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(26px,5vw,40px);line-height:1.05;color:var(--acc);font-weight:700}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:44px;padding:4px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sel{background:#FBEAF0;color:#993556;border-color:var(--acc)}
#nota{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0;min-height:70px;flex-wrap:wrap}
#big{font-size:clamp(36px,8vw,52px);font-weight:700;color:#993556;background:#FBEAF0;border-radius:18px;padding:0 28px;transition:transform .15s}
.pop{transform:scale(1.18)}
#info{font-size:15px;opacity:.85}
#box{display:flex;border-radius:18px;background:var(--soft);padding:10px 0;overflow:hidden}
#wrap{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hint{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;opacity:.8}
#set{display:none;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
#set.on{display:block}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.row b{width:100%;font-weight:500}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.sel{border-color:var(--ink)}
label.ck{display:flex;align-items:center;gap:8px;font-size:16px;min-height:44px}
label.ck input{width:22px;height:22px;accent-color:var(--acc)}
#pk{transition:transform .1s ease-out}
footer{text-align:center;font-size:13px;opacity:.7;margin-top:18px}
@media(prefers-reduced-motion:reduce){#pk,#big{transition:none}}
</style>
</head>
